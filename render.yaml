services:
  - type: web
    name: akuko-api
    runtime: docker
    rootDir: akukoNkeNdu
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /Akuko-nke-Ndu/quotes
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: akuko-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false